services:
  postgres:
    image: postgres:18
    container_name: pchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pchat
      POSTGRES_PASSWORD: pchat_dev_password
      POSTGRES_DB: pchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: pchat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
